<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Анатолий Лесли</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500&family=Playfair+Display:wght@500&family=Unbounded:wght@500&family=Marck+Script&family=Oswald:wght@500&family=Comfortaa:wght@500&family=Prata&family=Yeseva+One&family=Pacifico&family=Cormorant+Garamond:wght@600&family=Philosopher:wght@700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background:#1a0508; color:#f6f1e8; font-family: Manrope, sans-serif; }
  a { color: inherit; text-decoration: none; }
  .bg { position:fixed; inset:0; z-index:0; background:#140408; overflow:hidden; }
  .bg img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .veil { position:fixed; inset:0; z-index:1; pointer-events:none;
    background: linear-gradient(180deg, rgba(0,0,0,.28), transparent 26%, transparent 58%, rgba(0,0,0,.55)); }
  .topbar { position:fixed; top:0; left:0; right:0; z-index:5; display:flex; justify-content:space-between;
    padding: calc(16px + env(safe-area-inset-top)) 20px 12px; font-size:12px; letter-spacing:.18em; text-transform:uppercase; }
  .track { position:relative; z-index:2; }
  .line { height: 100vh; height: 100dvh; display:flex; flex-direction:column; justify-content:flex-end; padding: 12vh 22px calc(14vh + env(safe-area-inset-bottom)); }
  .kicker { letter-spacing:.26em; text-transform:uppercase; font-size:11px; color:#e4c27a; margin-bottom:14px; }
  h1,h2 { font-family:"Instrument Serif", serif; font-weight:400; line-height:.9; letter-spacing:-.03em; text-shadow:0 12px 30px rgba(0,0,0,.55); }
  h1 { font-size: clamp(56px, 14vw, 120px); }
  h2 { font-size: clamp(40px, 9vw, 84px); max-width:12ch; }
  p { margin-top:16px; max-width:28ch; line-height:1.45; color:rgba(246,241,232,.88); }
  .lesli { display:inline-block; }
  .stack { display:flex; flex-direction:column; gap:6px; margin-top:4px; align-items:flex-start; }
  .hl {
    display:block;
    font-family: Manrope, sans-serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #e4c27a;
    line-height: 1.4;
  }
  .links { margin-top:18px; display:flex; flex-direction:column; gap:8px; font-size:15px; letter-spacing:.04em; }
  .links a { border-bottom:none; padding-bottom:1px; }
</style>
</head>
<body>
  <div class="bg"><img id="frame" alt="" src="f/f001.webp" /></div>
  <div class="veil"></div>
  <div class="topbar"><span>Анатолий Лесли</span><span>Москва</span></div>
  <main class="track">
    <section class="line">
      <div class="kicker">ведущий</div>
      <h1>Анатолий<br><span class="lesli" id="lesli">Лесли</span></h1>
      <p>Ведение / Концерты / Шоу</p>
    </section>
    <section class="line">
      <div class="kicker">кружки</div>
      <div class="stack">
        <a class="hl" href="https://www.instagram.com/s/aGlnaGxpZ2h0OjE3ODk3NDMwNzgxMjkyODYw?story_media_id=3354965969468704581_1478881757&rpxt=ZDF6Y3E4Zjduamk=" target="_blank" rel="noopener">Импровизация</a>
        <a class="hl" href="https://www.instagram.com/s/aGlnaGxpZ2h0OjE4MDQ1NDE1ODI1MzAxMzQ0?story_media_id=2536785034151908614_1478881757&dlrf=a2E0dXZtbTRteWk3" target="_blank" rel="noopener">Шучу</a>
        <a class="hl" href="https://www.instagram.com/s/aGlnaGxpZ2h0OjE3ODYyMzY0NDIzMjI3MjU4?story_media_id=2635743208965873719_1478881757&cplk=dno1OW55b24yczhz" target="_blank" rel="noopener">Веду</a>
        <a class="hl" href="https://www.instagram.com/s/aGlnaGxpZ2h0OjE3OTM5ODEzMjUyNTgwMzQx?story_media_id=2729201198305240661_1478881757&srtk=eWljM2l2bHFtYWth" target="_blank" rel="noopener">худею</a>
        <a class="hl" href="https://www.instagram.com/s/aGlnaGxpZ2h0OjE3OTUyMTgyNzA0Mzk4NTIw?story_media_id=2485655636896157882_1478881757&rpxt=MWxwaXFkZzU3NHhqNA==" target="_blank" rel="noopener">ОТЗЫВЫ</a>
      </div>
    </section>
    <section class="line">
      <div class="kicker">lesly show</div>
      <h2>Хочу быть лучшей версией себя. И буду.</h2>
      <div class="links">
        <a href="https://www.instagram.com/leslypresley/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://t.me/leslypresley" target="_blank" rel="noopener">Telegram @leslypresley</a>
      </div>
    </section>
  </main>
  <script>
    const fonts = [
      '"Instrument Serif", serif',
      '"Playfair Display", serif',
      '"Unbounded", sans-serif',
      '"Marck Script", cursive',
      '"Oswald", sans-serif',
      '"Comfortaa", sans-serif',
      '"Prata", serif',
      '"Pacifico", cursive',
      '"Cormorant Garamond", serif',
      '"Philosopher", sans-serif'
    ];
    const lesli = document.getElementById("lesli");
    let fi = 0;
    setInterval(() => {
      fi = (fi + 1) % fonts.length;
      lesli.style.fontFamily = fonts[fi];
    }, 1000);

    const N = 78;
    const img = document.getElementById("frame");
    const urls = [];
    for (let i = 1; i <= N; i++) urls.push("f/f" + String(i).padStart(3,"0") + ".webp");
    for (let i = 0; i < N; i++) { const im = new Image(); im.src = urls[i]; }
    let last = -1;
    function paint() {
      const max = document.documentElement.scrollHeight - innerHeight;
      const p = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
      const i = Math.min(N - 1, Math.round(p * (N - 1)));
      if (i !== last) { last = i; img.src = urls[i]; }
    }
    addEventListener("scroll", paint, { passive: true });
    addEventListener("touchmove", paint, { passive: true });
    paint();
  </script>
</body>
</html>
